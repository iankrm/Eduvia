apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eduvia-ingress
  namespace: eduvia
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: eduvia.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eduvia-api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduvia-web
                port:
                  number: 80

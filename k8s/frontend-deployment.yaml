apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduvia-web
  namespace: eduvia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eduvia-web
  template:
    metadata:
      labels:
        app: eduvia-web
    spec:
      containers:
        - name: web
          image: eduvia-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: eduvia-config
                  key: VITE_API_URL
---
apiVersion: v1
kind: Service
metadata:
  name: eduvia-web
  namespace: eduvia
spec:
  selector:
    app: eduvia-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
